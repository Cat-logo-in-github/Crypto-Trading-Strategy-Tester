[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hypothesis-lab"
version = "0.4.0"
description = "A free local-first quantitative research workbench"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "Hypothesis Lab contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.9,<1", "mypy>=1.14,<2", "build>=1.2,<2"]
ml = ["scikit-learn>=1.5,<2"]
rl = ["gymnasium>=1,<2"]
onnx = ["onnxruntime>=1.20,<2"]

[project.scripts]
hypothesis-lab = "hypothesis_lab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hypothesis_lab = ["static/*", "fixtures/*"]

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py", "examples/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
files = ["src/hypothesis_lab"]
check_untyped_defs = true
ignore_missing_imports = true

