name: Core checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Offline tests
        run: python -m unittest discover -s tests -v
      - name: Lint
        run: python -m ruff check .
      - name: Formatting
        run: python -m ruff format --check .
      - name: Type checks
        run: python -m mypy src
      - name: Build Python distribution
        run: python -m build
      - name: Offline sample
        run: python -m hypothesis_lab sample --output dist/sample-result.json
      - name: Offline ML example
        run: python -m hypothesis_lab ml --output dist/ml-result.json
      - name: Build static documentation
        run: python scripts/build_site.py
      - name: Build and inspect release archive
        run: python scripts/package.py
      - name: Clean archive extraction
        run: python scripts/package.py --verify dist/hypothesis-lab.zip --extract dist/clean-check
      - name: Test extracted source
        working-directory: dist/clean-check/hypothesis-lab
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  optional-onnx:
    name: Optional native ONNX adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install optional inference and graph test dependencies
        run: python -m pip install -e ".[dev,onnx]" "onnx>=1.16,<2"
      - name: Require native dependencies so the optional job cannot silently skip
        run: python -c "import onnx, onnxruntime"
      - name: Execute self-contained graph through the real local adapter
        run: python -m unittest discover -s tests -p test_onnx_runtime.py -v
